<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock, Paper, Scissors!</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./scripts.js" defer></script>
    </head>

    <body>
        <div id="header">
            <h1>Rock, Paper, Scissors!</h1>
        </div>
        <div id="gameContainer">
            <div class="row" id="playerRow">
                <h3 id="playerHero">Choose Your Fighter!</h3>
                <div id="playerChoiceContainer">
                    <button class="choice" id="rockChoice">R</button>
                    <button class="choice" id="paperChoice">P</button>
                    <button class="choice" id="scissorsChoice">S</button>
                </div>
            </div>
            <div class="row" id="gameRow">
                <div class="choice" id="computerChoiceContainer">
                    <div id="computerChoice">
                        ?
                    </div>
                    <h3 id="computerHero">Computer Choice</h3>
                </div>
                <div id="resultWindow">
                    Choose a fighter to play!
                </div>
            </div>
            <div class="row" id="resultsRow">
                <div class="scoreWindow">
                    <div class="score" id="playerScore">0</div>
                    <div class="scoreHero">Player Score</div>
                </div>
                <div class="scoreWindow">
                    <div class="score" id="computerScore">0</div>
                    <div class="scoreHero">Computer Score</div>
                </div>
            </div>
        </div>
        <div id="footer">
            <p>Thanks for playing!</p>
        </div>
    </body>
</html>
